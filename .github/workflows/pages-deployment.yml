name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feed and styles index
        run: |
          python3 build_index.py
          python3 build_styles_index.py

      - name: Commit rebuilt pages
        run: |
          git config user.name "Никита Потехин"
          git config user.email "Npotehinru@gmail.com"
          git add index.html styles/index.html
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Пересобраны лента и галерея стилей [skip ci]"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=memory
